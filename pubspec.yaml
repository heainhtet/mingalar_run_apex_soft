name: mingalar_un
description: "Step Count App For Code Test"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  auto_route: ^11.1.0
  flutter_riverpod: ^3.3.2
  easy_localization: ^3.0.8
  gap: ^3.0.1
  curved_labeled_navigation_bar: ^2.0.6
  flutter_svg: ^2.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  cm_pedometer: ^1.2.0
  pedometer: ^4.2.0
  geolocator: ^14.0.3
  permission_handler: 12.0.1
  logger: ^2.7.0
  another_flushbar: 2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  image: ^4.9.2
  build_runner: ^2.4.15
  auto_route_generator: ^10.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/images/bottom_nav/
    - assets/images/home/upIcon.svg
    - assets/images/home/feature.png
    - assets/images/home/event1.png
    - assets/images/events/
    - assets/images/run/
    - assets/images/profile/
    - assets/images/onboarding/
    - assets/branding/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins/Poppins-BlackItalic.ttf
          weight: 900
          style: italic
