name: cm_pedometer
description: iOS Core Motion pedometer bridge used by Mingalar Run.
version: 1.2.0+local
publish_to: none

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: CMPedometerPlugin
